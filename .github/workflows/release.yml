name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-26-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          NOTES_FILE="${{ runner.temp }}/release-notes.md"
          .github/scripts/gen-release-notes.sh "$NOTES_FILE"

          echo 'notes<<EOF' >> "$GITHUB_OUTPUT"
          cat "$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "资产快照 v__VERSION__"
          releaseDraft: false
          prerelease: false
          releaseBody: ${{ steps.notes.outputs.notes }}
          args: --bundles ${{ matrix.bundles }}

      # Tauri 不产出 pkg，这里用构建好的 .app 现做一个分发安装包。
      # 注意：--bundles dmg 时 tauri-bundler 会清理 .app，所以先重新生成 .app（增量构建，很快）。
      - name: Build macOS pkg installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run tauri -- build --bundles app
          .github/scripts/build-macos-pkg.sh
        env:
          # 未配置这些 secrets 时为空字符串，脚本会自动跳过签名与公证
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS pkg installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_PATH=$(find src-tauri/target -path '*bundle/pkg/*.pkg' -print -quit)
          if [ -z "$PKG_PATH" ]; then
            echo "未找到 pkg 安装包" >&2
            exit 1
          fi
          echo "上传 $PKG_PATH"
          gh release upload "${{ github.ref_name }}" "$PKG_PATH" \
            --clobber --repo "${{ github.repository }}"

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish update.json to updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          cat > update.json << JSONEOF
          {
            "version": "$TAG_VERSION",
            "htmlUrl": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }
          JSONEOF

          if gh release view updater --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload updater update.json --clobber --repo "${{ github.repository }}"
          else
            gh release create updater update.json --title "Updater" --notes "Version info for auto-update." --repo "${{ github.repository }}"
          fi
