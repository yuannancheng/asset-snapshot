name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # 先建好 Release，各构建任务随后把产物按
  # 应用名_版本号_系统名_架构名.后缀 上传。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: .github/scripts/gen-release-notes.sh "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            printf 'Release %s 已存在，更新标题与说明\n' "$TAG"
            gh release edit "$TAG" --repo "$REPO" \
              --title "资产快照 v${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            printf '创建 Release %s\n' "$TAG"
            gh release create "$TAG" --repo "$REPO" \
              --verify-tag \
              --title "资产快照 v${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            asset_system: Linux
            asset_arch: x86
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            asset_system: Linux
            asset_arch: arm64
          - platform: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
            asset_system: macOS
            asset_arch: arm64
          - platform: macos-26-intel
            target: x86_64-apple-darwin
            bundles: dmg
            asset_system: macOS
            asset_arch: x86
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset_system: Windows
            asset_arch: x86

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils

      - name: Build bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      # Tauri 不产出 pkg，这里用构建好的 .app 现做一个分发安装包。
      # 注意：--bundles dmg 时 tauri-bundler 会清理 .app，所以先重新生成 .app（增量构建，很快）。
      - name: Build macOS pkg installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run tauri -- build --bundles app
          .github/scripts/build-macos-pkg.sh
        env:
          # 未配置这些 secrets 时为空字符串，脚本会自动跳过签名与公证
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect release assets
        shell: bash
        run: .github/scripts/collect-release-assets.sh "${{ matrix.asset_system }}" "${{ matrix.asset_arch }}"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          FILES=(release-assets/*)
          if [ "${#FILES[@]}" -eq 0 ]; then
            printf '没有可上传的安装包\n' >&2
            exit 1
          fi
          for FILE in "${FILES[@]}"; do
            printf '上传 %s\n' "$FILE"
            gh release upload "$TAG" "$FILE" --clobber --repo "$REPO"
          done

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish update.json to updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          cat > update.json << JSONEOF
          {
            "version": "$TAG_VERSION",
            "htmlUrl": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }
          JSONEOF

          if gh release view updater --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload updater update.json --clobber --repo "${{ github.repository }}"
          else
            gh release create updater update.json --title "Updater" --notes "Version info for auto-update." --repo "${{ github.repository }}"
          fi
