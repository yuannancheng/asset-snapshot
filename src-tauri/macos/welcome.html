<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            font-size: 13px;
            line-height: 1.6;
            color: #1d1d1f;
            margin: 0;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        .version {
            color: #6e6e73;
            font-weight: normal;
        }

        ul {
            margin: 12px 0 0;
            padding-left: 18px;
        }

        li {
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <h2>欢迎安装 资产快照 <span class="version">__VERSION__</span></h2>
    <p>安装程序会把「资产快照」放入「应用程序」文件夹，完成后即可在启动台或访达中打开。</p>
    <ul>
        <li>本地优先：数据保存在你自己的机器上</li>
        <li>支持可选加密（SQLCipher，AES-256）</li>
        <li>自动接管 <code>.asdb</code> 数据文件的打开方式</li>
    </ul>
</body>

</html>
